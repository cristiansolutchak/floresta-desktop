# Checks every push and pull request: formatting, analysis and tests on
# Linux, release builds of the app on macOS, Linux and Windows, and a scan of
# the dependencies for known vulnerabilities. The opt-in real-node suites
# (test/integration, integration_test) need local tools and are not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.5

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: Flutter 3.35.5 knows only Visual Studio 2022 (major 17)
        # and asks CMake for "Visual Studio 16 2019" on any other version, so
        # an image with a newer Visual Studio fails to generate build files.
        os: [macos-latest, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release --dart-define-from-file=config/release/production.json
      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release --dart-define-from-file=config/release/production.json
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release --dart-define-from-file=config/release/production.json

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile pubspec.lock
