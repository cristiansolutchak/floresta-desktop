name: floresta_gui
description: "Desktop GUI for running and managing a Floresta Bitcoin node."
publish_to: 'none'

# Keep lib/core/app_version.dart in step (a test checks it).
version: 0.0.1+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  fpdart: ^1.2.0
  equatable: ^3.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0
  bitcoin_base: 7.3.0
  blockchain_utils: 7.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Dashboard icons and logo.
  assets:
    - assets/logo-icon-text.svg
    # Window icon for the unpacked Linux bundle (linux/runner).
    - assets/app-icon/app-icon-256.png
    - assets/icons/sidebar/
    - assets/icons/overview/header/
    - assets/icons/overview/body/
    # This app's licence (MIT OR Apache-2.0) and Floresta's, whose florestad
    # binary the app installs; listed on Help > Licences.
    - LICENSE-MIT
    - LICENSE-APACHE
    - assets/licenses/floresta-LICENSE-MIT
    # Shipped with the font, as the SIL OFL 1.1 requires.
    - assets/fonts/Space_Grotesk/OFL.txt

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Bold.ttf
          weight: 700
